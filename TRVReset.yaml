blueprint:
  name: Reset Thermostat Temperature Above Threshold
  description: >
    If a climate entity's target temperature is set above a threshold,
    automatically reset it back down to a safe/default value.
  domain: automation
  input:
    climate_entity:
      name: Climate Entity
      description: The thermostat to monitor
      selector:
        entity:
          domain: climate
    max_temperature:
      name: Trigger Threshold
      description: Reset will fire when temperature is set above this value
      default: 26
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          unit_of_measurement: "°C"
    reset_temperature:
      name: Reset Temperature
      description: The temperature to reset the thermostat to
      default: 25
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          unit_of_measurement: "°C"

trigger:
  - trigger: numeric_state
    entity_id: !input climate_entity
    attribute: temperature
    above: !input max_temperature

condition: []

action:
  - action: climate.set_temperature
    target:
      entity_id: !input climate_entity
    data:
      temperature: !input reset_temperature

mode: single
